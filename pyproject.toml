[project]
name = "doudizhu-lab"
dynamic = ["version"]
description = "安卓真机斗地主画面、点击与牌面识别调试工具"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Doudizhu Lab contributors"}]
keywords = ["doudizhu", "douzero", "android", "adb", "computer-vision"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Natural Language :: Chinese (Simplified)",
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "PySide6-Essentials==6.8.3",
    "numpy==2.4.6",
    "opencv-python-headless==4.14.0.94",
    "av==18.0.0",
    "torch==2.9.1",
]

[project.scripts]
ddz-lab = "doudizhu_lab.cli.app:main"
ddz-device = "doudizhu_lab.cli.app:main"
ddz-check = "doudizhu_lab.cli.check:main"
ddz-bot-demo = "doudizhu_lab.ui.demo:main"

[project.optional-dependencies]
vision = [
    "onnxruntime==1.31.1",
    "rapidocr==3.10.0",
    "requests==2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doudizhu_lab"]

[tool.hatch.version]
path = "src/doudizhu_lab/__init__.py"

[tool.hatch.build.targets.wheel.force-include]
"pyproject.toml" = "doudizhu_lab/_resources/project/pyproject.toml"
"uv.lock" = "doudizhu_lab/_resources/project/uv.lock"
"README.md" = "doudizhu_lab/_resources/project/README.md"
"LICENSE" = "doudizhu_lab/_resources/project/LICENSE"
"NOTICE" = "doudizhu_lab/_resources/project/NOTICE"

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "tools/", "docs/", "examples/", "pyproject.toml", "uv.lock", ".python-version", "README.md", "LICENSE", "NOTICE", "CONTRIBUTING.md", "CHANGELOG.md", "SECURITY.md"]
exclude = ["data/", ".venv/", "**/__pycache__/", "**/*.pyc"]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-qt==4.5.0", "ruff==0.17.3"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
markers = [
    "local_data: 需要显式提供的本机历史样本，不进入公共CI",
    "model: 需要固定本机权重，不进入公共CI",
    "gui: 使用模拟设备的Qt交互测试",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["data", "src/doudizhu_lab/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
